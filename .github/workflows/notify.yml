name: Pull Request Discord Notification

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check for Mentions and Send Discord Notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION_MEMBERS: ${{ secrets.DISCORD_MENTION_MEMBERS }}

          # コメント本文やタイトルは誰でも書けるため、run: に ${{ }} で直接展開せず env 経由で渡す
          # (展開するとシェルスクリプトとして解釈され、任意コマンドを実行できてしまう)
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          NOTIFICATION_AUTHOR: ${{ github.event.sender.login }}
          IS_PULL_REQUEST: ${{ github.event.issue.pull_request != null }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REVIEW_COMMENT_URL: ${{ github.event.comment.html_url }}
        run: |
          if [ "$EVENT_NAME" == "issue_comment" ]; then
            # コメントがプルリクエストに紐付いているかを確認
            if [ "$IS_PULL_REQUEST" == "true" ]; then
              NOTIFICATION_TITLE="PR: $ISSUE_TITLE"
              NOTIFICATION_TYPE="Pull Request Comment"
            else
              NOTIFICATION_TITLE="ISSUE: $ISSUE_TITLE"
              NOTIFICATION_TYPE="Issue Comment"
            fi
            NOTIFICATION_URL="$ISSUE_URL"
          elif [ "$EVENT_NAME" == "pull_request_review_comment" ]; then
            NOTIFICATION_TITLE="PR Review: $PR_TITLE"
            NOTIFICATION_URL="$REVIEW_COMMENT_URL" # レビューコメント自体のURL
            NOTIFICATION_TYPE="Pull Request Review Comment"
          else
            echo "Unsupported event type: $EVENT_NAME. Skipping notification."
            exit 0
          fi

          # Discordメンションマップを読み込む
          MENTION_MAP=$(echo "$DISCORD_MENTION_MEMBERS")

          # Discord用に変換されたメンションを格納する変数
          DISCORD_MENTIONS=""
          REGISTERED_MENTION_COUNT=0

          # コメント本文からメンションを検出
          DETECTED_MENTIONS=$(echo "$COMMENT_BODY" | grep -oE '@[a-zA-Z0-9_-]+' | tr '\n' ' ')

          if [ -z "$DETECTED_MENTIONS" ]; then
            echo "メンションが検出されませんでした。Discord通知をスキップします。"
            exit 0
          fi

          FORMATTED_COMMENT_BODY=$(echo "$COMMENT_BODY" | sed -E ':a;N;$!ba;s/\n/\n\n/g')

          for github_mention in $DETECTED_MENTIONS; do
            github_id="${github_mention#@}"

            discord_user_id=$(echo "$MENTION_MAP" | jq -r ".\"$github_id\" // \"\"")

            if [ -n "$discord_user_id" ]; then
              DISCORD_MENTIONS+="<@${discord_user_id}> "
              REGISTERED_MENTION_COUNT=$((REGISTERED_MENTION_COUNT + 1))
            else
              DISCORD_MENTIONS+="${github_mention} (未登録) "
            fi
          done

          # bot のコメントは import パス (@frontend 等) や bot 名もメンションとして拾うため、
          # 登録済みメンバー宛てが無ければ通知しない
          if [ "$REGISTERED_MENTION_COUNT" -eq 0 ]; then
            echo "登録済みメンバーへのメンションがありません。Discord通知をスキップします。"
            exit 0
          fi

          DISCORD_MENTIONS=$(echo "$DISCORD_MENTIONS" | xargs)

          printf -v MESSAGE_HEADER "新しい%sでメンションがあります！\n\n**タイトル:** %s\n**作成者:** %s\n**メンション:** %s\n**URL:** %s\n\n**コメント内容:**\n" \
            "$NOTIFICATION_TYPE" \
            "$NOTIFICATION_TITLE" \
            "$NOTIFICATION_AUTHOR" \
            "$DISCORD_MENTIONS" \
            "$NOTIFICATION_URL"

          # Discord は 2000 文字を超えるメッセージを 400 で拒否するため、本文を切り詰める
          PAYLOAD=$(jq -n --arg header "$MESSAGE_HEADER" --arg body "$FORMATTED_COMMENT_BODY" '
            ([1990 - ($header | length), 0] | max) as $room
            | {"content": ($header + (if ($body | length) > $room then $body[0:([$room - 1, 0] | max)] + "…" else $body end))}')

          curl -sS --fail-with-body -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"
