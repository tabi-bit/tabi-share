[project]
name = "server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16.4",
    "asyncpg>=0.31.0",
    "bcrypt>=4.3.0",
    "fastapi>=0.116.1",
    "firebase-admin>=7.5.0",
    "gunicorn>=24.1.1",
    "nanoid>=2.0.0",
    "passlib>=1.7.4",
    "pydantic-settings>=2.12.0",
    "pydantic[email]>=2.11.7",
    "pyjwt>=2.12.1",
    "python-dotenv>=1.1.1",
    "sqlalchemy>=2.0.42",
    "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.17.1",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.12.7",
    "types-nanoid>=2.0.0.20260508",
    "types-passlib>=1.7.7.20250602",
]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
exclude = ["migrations/versions"]

[tool.ruff.lint]
# 既定 (E, F) に加え、FastAPI の依存/パラメータを Annotated 形式で書くことを強制する。
# FAST002: `x: T = Depends(...)` / `x: T = Query(...)` を禁止し `x: Annotated[T, ...]` を必須化。
# ※ FAST001 (冗長な response_model) / FAST003 は既存コードに多数該当するため今は有効化しない。
extend-select = ["FAST002"]

[tool.mypy]
# firebase-admin は型スタブ・py.typed マーカーを配布していないため import-untyped を無視する。
[[tool.mypy.overrides]]
module = "firebase_admin.*"
ignore_missing_imports = true
